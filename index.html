<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1976d2">
<title>Budi Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf4fc;color:#183153;font-family:Arial,sans-serif}
header{background:#1976d2;color:white;padding:17px;display:flex;justify-content:space-between;align-items:center}
header strong{font-size:22px}
header small{display:block;font-size:12px;margin-top:4px}
main{max-width:720px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:16px;margin-bottom:14px;box-shadow:0 3px 14px #173b6210}
h2{font-size:19px;margin:0 0 13px}
input{width:100%;padding:12px;border:1px solid #d6e2f0;border-radius:10px;margin:6px 0;font:inherit}
button{border:0;border-radius:10px;background:#1976d2;color:white;padding:12px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#e7f1ff;color:#145bb0}
.row{display:flex;gap:8px}
.row>*{min-width:0;flex:1}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu button{min-height:64px;font-size:13px}
.muted{font-size:13px;color:#718198;line-height:1.5}
.hidden{display:none!important}
#status{padding:10px;border-radius:9px;background:#e8f2ff;font-size:13px;overflow-wrap:anywhere;margin-bottom:12px}
#messages{height:320px;overflow-y:auto;background:#f5f8fc;border-radius:12px;padding:10px;margin:10px 0}
.msg{background:white;border:1px solid #e2eaf5;padding:9px 12px;border-radius:12px;margin:8px 0;overflow-wrap:anywhere}
.msg.mine{background:#dcecff;margin-left:25px}
.msg small{display:block;color:#64748b;font-size:11px;margin-bottom:4px}
#chatComposer{display:flex;gap:7px}
#chatComposer input{flex:1;min-width:0}
#chatComposer button{align-self:center}
@media(max-width:420px){main{padding:10px}.card{padding:14px}.menu{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
 <div><strong>💬 Budi Chat</strong><small>Terhubung bersama teman</small></div>
 <button id="logout" class="secondary hidden">Keluar</button>
</header>

<main>
 <div id="status">Memeriksa konfigurasi Firebase...</div>

 <section id="auth" class="card">
  <h2>Masuk ke Budi Chat</h2>
  <p class="muted">Masuk atau buat akun menggunakan email dan password.</p>
  <input id="email" type="email" placeholder="Alamat email" autocomplete="email">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <div class="row">
   <button id="login">Masuk</button>
   <button id="register" class="secondary">Daftar</button>
  </div>
  <p class="muted">Jaga kerahasiaan password kamu.</p>
 </section>

 <div id="app" class="hidden">
  <section class="card">
   <h2>👤 Profil</h2>
   <input id="displayName" placeholder="Nama tampilan" maxlength="60">
   <input id="username" placeholder="Username, contoh: budi123" maxlength="24">
   <button id="saveProfile">Simpan profil</button>
   <p id="profileInfo" class="muted"></p>
  </section>

  <section class="card">
   <h2>Menu Budi Chat</h2>
   <div class="menu">
    <button data-page="chat">💬 Chat pribadi</button>
    <button data-page="groups">👥 Grup</button>
    <button data-page="channels">📢 Channel</button>
    <button data-page="bots">🤖 Bot</button>
    <button data-page="userbots">⚙️ Userbot</button>
    <button data-page="profile">👤 Profil</button>
   </div>
  </section>

  <section id="chatPage" class="card">
   <h2>💬 Chat pribadi</h2>
   <p class="muted">Masukkan username teman yang sudah terdaftar.</p>
   <div class="row">
    <input id="targetUsername" placeholder="Username teman">
    <button id="openChat">Buka chat</button>
   </div>
   <p id="chatPartner" class="muted">Belum memilih teman.</p>
   <div id="messages"></div>
   <div id="chatComposer">
    <input id="messageInput" placeholder="Tulis pesan..." maxlength="3000">
    <button id="sendMessage">Kirim</button>
   </div>
  </section>

  <section id="otherPage" class="card hidden">
   <h2 id="otherTitle">Menu</h2>
   <p id="otherDescription" class="muted"></p>
  </section>
 </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
// GANTI DENGAN KONFIGURASI ASLI DARI FIREBASE CONSOLE
const firebaseConfig = {
  apiKey: "AIzaSyBsKlsABrsIAxy8_MiYlk1NljiCNsLQcuU",
  authDomain: "budi-chat.firebaseapp.com",
  projectId: "budi-chat",
  storageBucket: "http://budi-chat.firebasestorage.app",
  messagingSenderId: "65698455662",
  appId: "1:65698455662:web:1e668045ce65959f44c67f"
};

const $ = id => document.getElementById(id);
let auth, db, currentUser = null, activeChat = null;
let stopMessages = null;
let busy = false;

function status(message){
  $("status").textContent = message;
}

function errorText(e){
  const messages = {
    "auth/email-already-in-use":"Email sudah terdaftar.",
    "auth/invalid-email":"Format email tidak valid.",
    "auth/weak-password":"Password minimal 6 karakter.",
    "auth/invalid-credential":"Email atau password salah.",
    "auth/too-many-requests":"Terlalu banyak percobaan. Coba lagi nanti.",
    "permission-denied":"Akses ditolak. Periksa Firestore Rules."
  };
  if(e.message === "Username sudah digunakan.") return e.message;
  return messages[e.code] || e.message || "Terjadi kesalahan.";
}

function setBusy(value){
  busy = value;
  ["login","register","saveProfile","openChat","sendMessage"]
    .forEach(id => $(id).disabled = value);
}

function validConfig(){
  return firebaseConfig.apiKey !== "ISI_API_KEY" &&
    firebaseConfig.authDomain !== "ISI_AUTH_DOMAIN" &&
    firebaseConfig.projectId !== "ISI_PROJECT_ID" &&
    firebaseConfig.appId !== "ISI_APP_ID";
}

function stopChatListener(){
  if(stopMessages){
    stopMessages();
    stopMessages = null;
  }
}

function validUsername(name){
  return /^[a-z0-9_]{3,24}$/.test(name);
}

if(!validConfig()){
  status("Ganti semua nilai firebaseConfig dengan konfigurasi asli Firebase.");
}else{
  try{
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();

    $("login").onclick = async () => {
      if(busy) return;
      try{
        setBusy(true);
        await auth.signInWithEmailAndPassword(
          $("email").value.trim(),
          $("password").value
        );
      }catch(e){
        status(errorText(e));
      }finally{
        setBusy(false);
      }
    };

    $("register").onclick = async () => {
      if(busy) return;
      try{
        setBusy(true);
        await auth.createUserWithEmailAndPassword(
          $("email").value.trim(),
          $("password").value
        );
        status("Akun berhasil dibuat. Silakan lengkapi profil.");
      }catch(e){
        status(errorText(e));
      }finally{
        setBusy(false);
      }
    };

    $("logout").onclick = async () => {
      stopChatListener();
      activeChat = null;
      currentUser = null;
      try{
        await auth.signOut();
        status("Kamu sudah keluar.");
      }catch(e){
        status(errorText(e));
      }
    };

    auth.onAuthStateChanged(async user => {
      currentUser = user;
      activeChat = null;
      stopChatListener();
      $("messages").replaceChildren();
      $("auth").classList.toggle("hidden",!!user);
      $("app").classList.toggle("hidden",!user);
      $("logout").classList.toggle("hidden",!user);

      if(!user){
        status("Silakan masuk atau daftar.");
        return;
      }

      try{
        const doc = await db.collection("users").doc(user.uid).get();
        if(!auth.currentUser || auth.currentUser.uid !== user.uid) return;
        const p = doc.data() || {};
        $("displayName").value = p.displayName || "";
        $("username").value = p.username || "";
        $("profileInfo").textContent = p.username
          ? "Login sebagai " + user.email + " · @" + p.username
          : "Login sebagai " + user.email + ". Lengkapi profil kamu.";
        status("Berhasil masuk.");
      }catch(e){
        status(errorText(e));
      }
    });

    $("saveProfile").onclick = async () => {
      if(busy || !currentUser) return;

      const displayName = $("displayName").value.trim();
      const username = $("username").value.trim()
        .replace(/^@/,"").toLowerCase();

      if(!displayName || displayName.length > 60 ||
         !validUsername(username)){
        status("Isi nama tampilan dan username 3–24 karakter (huruf kecil, angka, underscore).");
        return;
      }

      try{
        setBusy(true);
        const uid = currentUser.uid;
        const userRef = db.collection("users").doc(uid);
        const nameRef = db.collection("usernames").doc(username);

        await db.runTransaction(async tx => {
          const userSnap = await tx.get(userRef);
          const oldUsername = userSnap.exists
            ? userSnap.data().username : null;

          const nameSnap = await tx.get(nameRef);
          if(nameSnap.exists && nameSnap.data().uid !== uid){
            throw new Error("Username sudah digunakan.");
          }

          let oldRef = null;
          let oldSnap = null;

          if(oldUsername && oldUsername !== username){
            oldRef = db.collection("usernames").doc(oldUsername);
            oldSnap = await tx.get(oldRef);
          }

          tx.set(nameRef,{uid});
          tx.set(userRef,{
            uid:uid,
            displayName:displayName,
            username:username,
            updatedAt:firebase.firestore.FieldValue.serverTimestamp()
          },{merge:true});

          if(oldRef && oldSnap && oldSnap.exists &&
             oldSnap.data().uid === uid){
            tx.delete(oldRef);
          }
        });

        $("profileInfo").textContent =
          displayName + " · @" + username;
        status("Profil berhasil disimpan.");
      }catch(e){
        status(errorText(e));
      }finally{
        setBusy(false);
      }
    };

    $("openChat").onclick = async () => {
      if(busy || !currentUser) return;

      const username = $("targetUsername").value.trim()
        .replace(/^@/,"").toLowerCase();

      if(!validUsername(username)){
        status("Masukkan username yang valid.");
        return;
      }

      if(username === $("username").value.trim()
         .replace(/^@/,"").toLowerCase()){
        status("Kamu tidak bisa chat dengan akun sendiri.");
        return;
      }

      try{
        setBusy(true);
        const nameDoc = await db.collection("usernames")
          .doc(username).get();

        if(!nameDoc.exists){
          status("Username tidak ditemukan.");
          return;
        }

        const otherUid = nameDoc.data().uid;
        if(!otherUid || otherUid === currentUser.uid){
          status("Pengguna tidak valid.");
          return;
        }

        const otherDoc = await db.collection("users")
          .doc(otherUid).get();

        if(!otherDoc.exists){
          status("Profil pengguna tidak ditemukan.");
          return;
        }

        const members = [currentUser.uid,otherUid].sort();
        const chatId = members.join("_");
        const chatRef = db.collection("chats").doc(chatId);

        await db.runTransaction(async tx => {
          const snap = await tx.get(chatRef);
          if(!snap.exists){
            tx.set(chatRef,{
              members:members,
              createdAt:firebase.firestore.FieldValue.serverTimestamp()
            });
          }else{
            const data = snap.data();
            if(!Array.isArray(data.members) ||
               data.members.length !== 2 ||
               !members.every(x => data.members.includes(x))){
              throw new Error("Data chat tidak valid.");
            }
          }
        });

        activeChat = chatId;
        $("chatPartner").textContent =
          "Chat dengan " + (otherDoc.data().displayName || username) +
          " (@" + username + ")";
        stopChatListener();
        $("messages").replaceChildren();

        stopMessages = chatRef.collection("messages")
          .orderBy("createdAt","asc").limit(100)
          .onSnapshot(snapshot => {
            const box = $("messages");
            box.replaceChildren();

            snapshot.forEach(doc => {
              const m = doc.data();
              const item = document.createElement("div");
              item.className = "msg" +
                (m.senderId === currentUser.uid ? " mine" : "");

              const meta = document.createElement("small");
              meta.textContent =
                m.senderId === currentUser.uid ? "Kamu" : username;

              const body = document.createElement("div");
              body.textContent = m.text || "";

              item.append(meta,body);
              box.appendChild(item);
            });

            box.scrollTop = box.scrollHeight;
          },e => status(errorText(e)));

        status("Chat terbuka.");
      }catch(e){
        status(errorText(e));
      }finally{
        setBusy(false);
      }
    };

    async function send(){
      if(busy || !currentUser || !activeChat){
        status("Pilih chat terlebih dahulu.");
        return;
      }

      const message = $("messageInput").value.trim();
      if(!message) return;

      try{
        setBusy(true);
        await db.collection("chats").doc(activeChat)
          .collection("messages").add({
            senderId:currentUser.uid,
            text:message,
            createdAt:firebase.firestore.FieldValue.serverTimestamp()
          });
        $("messageInput").value = "";
      }catch(e){
        status(errorText(e));
      }finally{
        setBusy(false);
      }
    }

    $("sendMessage").onclick = send;
    $("messageInput").addEventListener("keydown",e => {
      if(e.key === "Enter") send();
    });

    document.querySelectorAll("[data-page]").forEach(btn => {
      btn.onclick = () => {
        const page = btn.dataset.page;
        $("chatPage").classList.toggle("hidden",page !== "chat");
        $("otherPage").classList.toggle("hidden",page === "chat");

        const pages = {
          groups:["Grup","Fitur grup belum dibuat."],
          channels:["Channel","Fitur channel belum dibuat."],
          bots:["Bot","Fitur bot memerlukan backend yang aman."],
          userbots:["Userbot","Fitur userbot belum dibuat."],
          profile:["Profil","Ubah nama dan username pada bagian Profil."]
        };

        if(pages[page]){
          $("otherTitle").textContent = pages[page][0];
          $("otherDescription").textContent = pages[page][1];
        }
      };
    });

  }catch(e){
    status("Firebase gagal dimulai: " + errorText(e));
  }
}
</script>
</body>
</html>
